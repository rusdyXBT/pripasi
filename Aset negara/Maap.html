<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Dari Badutmu🤙👍 </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:'Nunito',sans-serif;
}

body{
    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg') no-repeat center center fixed;
    background-size:cover;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    color:white;

    position:relative;

    transition:
    background-image 1.8s ease,
    background-color 1.8s ease;

    animation:bgZoom 18s ease-in-out infinite alternate;
}

@keyframes bgZoom{
    0%{
        background-size:100%;
    }
    100%{
        background-size:110%;
    }
}

body::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.12);

    backdrop-filter:blur(2px);

    z-index:1;
}

body::after{
    content:"";
    position:absolute;

    width:480px;
    height:480px;

    border-radius:50%;

    background:radial-gradient(circle,
    rgba(255,77,109,.16),
    transparent 70%);

    filter:blur(28px);

    z-index:1;

    animation:glowMove 8s ease-in-out infinite alternate;
}

@keyframes glowMove{
    0%{
        transform:translate(-30px,-20px);
    }
    100%{
        transform:translate(30px,20px);
    }
}

#overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.82);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:100;
}

.surat-avatar{
    width:140px;
    height:140px;

    margin-bottom:24px;

    border-radius:24px;

    border:4px solid rgba(255,255,255,.88);

    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/love-letter-send-love.gif') center/cover;

    box-shadow:
    0 0 20px rgba(255,255,255,.18),
    0 0 35px rgba(255,77,109,.18);

    animation:floaty 3s ease-in-out infinite;
}

@keyframes floaty{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

#overlay button{
    border:none;
    color:white;

    cursor:pointer;

    font-size:17px;
    font-weight:900;

    padding:16px 30px;

    border-radius:50px;

    background:linear-gradient(135deg,#ff4d6d,#ff758f);

    box-shadow:
    0 10px 25px rgba(255,77,109,.35);

    transition:.25s;
}

#overlay button:active{
    transform:scale(.96);
}

.card{
    position:relative;
    z-index:10;

    width:88%;
    max-width:325px;

    padding-top:72px;

    display:none;

    transform:translateY(-10px);
}

.avatar{
    width:128px;
    height:128px;

    position:absolute;

    top:0;
    left:50%;

    transform:translate(-50%,-48%);

    border-radius:50%;

    border:5px solid rgba(255,255,255,.95);

    background:center/cover no-repeat;

    box-shadow:
    0 0 18px rgba(255,255,255,.18),
    0 0 30px rgba(255,77,109,.18),
    0 10px 22px rgba(0,0,0,.30);

    z-index:20;

    transition:.5s ease;
}

.text-box{
    position:relative;

    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg') center/cover;

    border-radius:30px;

    padding:88px 18px 24px;

    overflow:hidden;

    border:1.5px solid rgba(255,255,255,0.18);

    box-shadow:
    0 10px 30px rgba(0,0,0,.28);
}

.text-box::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.18);

    backdrop-filter:blur(6px);

    border-radius:30px;

    z-index:0;
}

.text-box::after{
    content:"";

    position:absolute;

    top:-120%;
    left:-60%;

    width:70%;
    height:250%;

    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.16),
    transparent
    );

    transform:rotate(25deg);

    animation:glassMove 7s linear infinite;

    z-index:1;
}

@keyframes glassMove{
    0%{
        left:-80%;
    }
    100%{
        left:160%;
    }
}

.text{
    position:relative;
    z-index:2;

    font-size:19px;

    line-height:1.6;

    min-height:110px;

    font-weight:900;

    letter-spacing:.2px;

    text-align:center;

    text-shadow:
    0 2px 8px rgba(0,0,0,.55);
}

.typing::after{
    content:" |";

    display:inline-block;

    color:#ffffff;

    font-weight:900;

    margin-left:3px;

    text-shadow:
    0 0 8px rgba(255,255,255,.95),
    0 0 14px rgba(255,255,255,.55);

    animation:blinkCursor .7s infinite;
}

@keyframes blinkCursor{

    0%{
        opacity:1;
    }

    50%{
        opacity:0;
    }

    100%{
        opacity:1;
    }
}

/* tombol */

.btn-wrapper{
    margin-top:14px;

    position:relative;

    height:120px;

    opacity:0;

    transition:.4s;

    z-index:9999;
}

button{
    border:none;

    cursor:pointer;

    padding:13px 5px;

    font-size:15px;

    font-weight:900;

    border-radius:18px;

    transition:.2s;
}

button:active{
    transform:scale(.95);
}

#yes{
    position:absolute;

    left:0;
    top:0;

    width:48%;

    background:linear-gradient(135deg,#ffffff,#ffe7ee);

    color:#ff4d6d;

    z-index:2;

    box-shadow:
    0 6px 18px rgba(255,255,255,.18);
}

#no{
    position:absolute;

    right:0;
    top:0;

    width:48%;

    background:linear-gradient(135deg,#ff3c5f,#ff6b81);

    color:white;

    z-index:99999;

    box-shadow:
    0 6px 18px rgba(255,77,109,.25);
}

.vibrate-mode{
    animation:vibrate .15s linear infinite;
}

@keyframes vibrate{
    0%{
        transform:translateY(-10px);
    }
    25%{
        transform:translate(-3px,3px) translateY(-10px);
    }
    50%{
        transform:translate(3px,-3px) translateY(-10px);
    }
    100%{
        transform:translateY(-10px);
    }
}

.flower{
    position:fixed;

    top:-20px;

    font-size:20px;

    pointer-events:none;

    z-index:2;

    animation:flowerFall linear forwards;
}

@keyframes flowerFall{
    0%{
        transform:
        translateY(0)
        rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
        translateY(110vh)
        translateX(50px)
        rotate(360deg);

        opacity:0;
    }
}

</style>
</head>

<body>

<div id="overlay">
    <div class="surat-avatar"></div>
    <button onclick="mulai()">ADA PESAN DARI BADUTMU KLIK SAJAH 💌</button>
</div>

<div class="card" id="mainCard">

    <div class="avatar" id="catGif"></div>

    <div class="text-box">
        <div class="text typing" id="text"></div>
    </div>

    <div class="btn-wrapper" id="btnGroup">
        <button id="yes">Iya dimaapin😇</button>
        <button id="no">Emooh😏!</button>
    </div>

</div>

<script>

const textEl = document.getElementById("text");
const btnGroup = document.getElementById("btnGroup");
const noBtn = document.getElementById("no");
const mainCard = document.getElementById("mainCard");

const texts = [
"Minal aidin wal faizin mon maap lahir batin betinaku ❤️",
"Maapkan diriku jika ada salah 🤗",
"Memang diriku kadang membuatmu kesal karena diriku pembuli hamdal 🤙",
"Intinyah maapkan diriku jir lah kesayanganku 👍"
];

const angryTexts = [
"PARAH ANY AYANG!!! 💢",
"KOG MASI PENCET ITU SIH SAYANG! 😤",
"AH MALAS MALAS! 😫",
"KLIK IYAH AJA KENAPA SIH 👊",
"APA SUSAHNYA KLIK MAAPKAN 🥺",
"ISSSH AYANG 😡"
];

let step = 0;
let angryIdx = 0;
let isTyping = false;

function createFlower(){

    const flower = document.createElement("div");

    flower.className = "flower";

    const flowers = ["🌸","🌺","💮","🌷","✨"];

    flower.innerHTML =
    flowers[Math.floor(Math.random()*flowers.length)];

    flower.style.left =
    Math.random() * 100 + "vw";

    flower.style.animationDuration =
    (Math.random()*4 + 5) + "s";

    flower.style.fontSize =
    (Math.random()*12 + 16) + "px";

    document.body.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },9000);
}

setInterval(createFlower,700);

function mulai(){

    document.getElementById("overlay").style.display = "none";

    mainCard.style.display = "block";

    typeWriter(texts[0], textEl, () => {

        btnGroup.style.opacity = "1";

    });
}

function typeWriter(text, element, callback){

    if(isTyping) return;

    isTyping = true;

    element.classList.add("typing");

    let i = 0;

    element.textContent = "";

    btnGroup.style.opacity = "0";

    function type(){

        if(i < text.length){

            element.textContent += text.charAt(i);

            i++;

            setTimeout(type, 150);

        }else{

            isTyping = false;

            if(callback) setTimeout(callback,300);
        }
    }

    type();
}

document.getElementById("yes").onclick = () => {

    if(isTyping) return;

    step++;

    if(step < texts.length){

        typeWriter(texts[step], textEl, () => {

            btnGroup.style.opacity = "1";

        });

    }else{

        btnGroup.style.display = "none";

        textEl.textContent =
        "MAKASIH YA SUDAH DIMAAPKAN! 🥰🙏";
    }
};

noBtn.addEventListener("click", () => {

    if(navigator.vibrate){
        navigator.vibrate([150,50,150]);
    }

    mainCard.classList.add("vibrate-mode");

    setTimeout(() => {
        mainCard.classList.remove("vibrate-mode");
    }, 250);

    textEl.textContent =
    angryTexts[angryIdx % angryTexts.length];

    angryIdx++;

    const btnWidth =
    noBtn.offsetWidth;

    const btnHeight =
    noBtn.offsetHeight;

    const areaWidth =
    mainCard.clientWidth - btnWidth;

    const areaHeight =
    mainCard.clientHeight - btnHeight - 20;

    let randomX =
    Math.random() * areaWidth;

    let randomY =
    Math.random() * areaHeight;

    if(randomY < 20){
        randomY = 20;
    }

    noBtn.style.position = "absolute";

    noBtn.style.left =
    randomX + "px";

    noBtn.style.top =
    randomY + "px";

    noBtn.style.right = "auto";

    noBtn.style.zIndex = "99999";
});

</script>

</body>
</html>
