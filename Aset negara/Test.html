<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Dari Badutmu🤙👍 🔐</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:'Nunito',sans-serif;
}

body{
    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg') no-repeat center center fixed;
    background-size:cover;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    color:white;

    position:relative;

    transition:
    background-image 1.8s ease,
    background-color 1.8s ease;

    animation:bgZoom 18s ease-in-out infinite alternate;
}

/* auto zoom */
@keyframes bgZoom{
    0%{
        background-size:100%;
    }
    100%{
        background-size:110%;
    }
}

/* blur tipis */
body::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.12);

    backdrop-filter:blur(2px);

    z-index:1;
}

/* glow */
body::after{
    content:"";
    position:absolute;

    width:480px;
    height:480px;

    border-radius:50%;

    background:radial-gradient(circle,
    rgba(255,77,109,.16),
    transparent 70%);

    filter:blur(28px);

    z-index:1;

    animation:glowMove 8s ease-in-out infinite alternate;
}

@keyframes glowMove{
    0%{
        transform:translate(-30px,-20px);
    }
    100%{
        transform:translate(30px,20px);
    }
}

/* ================= OVERLAY ================= */

#overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.82);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:100;
}

/* surat */
.surat-avatar{
    width:140px;
    height:140px;

    margin-bottom:24px;

    border-radius:24px;

    border:4px solid rgba(255,255,255,.88);

    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/love-letter-send-love.gif') center/cover;

    box-shadow:
    0 0 20px rgba(255,255,255,.18),
    0 0 35px rgba(255,77,109,.18);

    animation:floaty 3s ease-in-out infinite;
}

@keyframes floaty{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

#overlay button{
    border:none;
    color:white;

    cursor:pointer;

    font-size:17px;
    font-weight:900;

    padding:16px 30px;

    border-radius:50px;

    background:linear-gradient(135deg,#ff4d6d,#ff758f);

    box-shadow:
    0 10px 25px rgba(255,77,109,.35);

    transition:.25s;
}

#overlay button:active{
    transform:scale(.96);
}

/* ================= CARD ================= */

.card{
    position:relative;
    z-index:10;

    width:88%;
    max-width:325px;

    padding-top:72px;

    display:none;

    transform:translateY(-10px);
}

/* gif */
.avatar{
    width:128px;
    height:128px;

    position:absolute;

    top:0;
    left:50%;

    transform:translate(-50%,-48%);

    border-radius:50%;

    border:5px solid rgba(255,255,255,.95);

    background:center/cover no-repeat;

    box-shadow:
    0 0 18px rgba(255,255,255,.18),
    0 0 30px rgba(255,77,109,.18),
    0 10px 22px rgba(0,0,0,.30);

    z-index:20;

    transition:.5s ease;
}

/* kotak */
.text-box{
    position:relative;

    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg') center/cover;

    border-radius:30px;

    padding:88px 18px 24px;

    overflow:hidden;

    border:1.5px solid rgba(255,255,255,0.18);

    box-shadow:
    0 10px 30px rgba(0,0,0,.28);
}

/* blur */
.text-box::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.18);

    backdrop-filter:blur(6px);

    border-radius:30px;

    z-index:0;
}

/* glass reflection */
.text-box::after{
    content:"";

    position:absolute;

    top:-120%;
    left:-60%;

    width:70%;
    height:250%;

    background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.16),
    transparent
    );

    transform:rotate(25deg);

    animation:glassMove 7s linear infinite;

    z-index:1;
}

@keyframes glassMove{
    0%{
        left:-80%;
    }
    100%{
        left:160%;
    }
}

/* text */
.text{
    position:relative;
    z-index:2;

    font-size:19px;

    line-height:1.6;

    min-height:110px;

    font-weight:900;

    letter-spacing:.2px;

    text-align:center;

    text-shadow:
    0 2px 8px rgba(0,0,0,.55);
}

/* typing cursor */
.typing::after{
    content:" |";

    display:inline-block;

    color:#ffffff;

    font-weight:900;

    margin-left:3px;

    text-shadow:
    0 0 8px rgba(255,255,255,.95),
    0 0 14px rgba(255,255,255,.55);

    animation:blinkCursor .7s infinite;
}

@keyframes blinkCursor{

    0%{
        opacity:1;
    }

    50%{
        opacity:0;
    }

    100%{
        opacity:1;
    }
}

/* tombol */
.btn-wrapper{
    margin-top:14px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    opacity:0;

    transition:.4s;
}

button{
    border:none;

    cursor:pointer;

    padding:13px 5px;

    font-size:15px;

    font-weight:900;

    border-radius:18px;

    transition:.2s;
}

button:active{
    transform:scale(.95);
}

#yes{
    background:linear-gradient(135deg,#ffffff,#ffe7ee);

    color:#ff4d6d;

    box-shadow:
    0 6px 18px rgba(255,255,255,.18);
}

#no{
    background:linear-gradient(135deg,#ff3c5f,#ff6b81);

    color:white;

    position:relative;

    box-shadow:
    0 6px 18px rgba(255,77,109,.25);
}

/* vibrate */
.vibrate-mode{
    animation:vibrate .15s linear infinite;
}

@keyframes vibrate{
    0%{
        transform:translateY(-10px);
    }
    25%{
        transform:translate(-3px,3px) translateY(-10px);
    }
    50%{
        transform:translate(3px,-3px) translateY(-10px);
    }
    100%{
        transform:translateY(-10px);
    }
}

/* bunga jatuh */
.flower{
    position:fixed;

    top:-20px;

    font-size:20px;

    pointer-events:none;

    z-index:2;

    animation:flowerFall linear forwards;
}

@keyframes flowerFall{
    0%{
        transform:
        translateY(0)
        rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
        translateY(110vh)
        translateX(50px)
        rotate(360deg);

        opacity:0;
    }
}

</style>
</head>

<body>

<div id="overlay">
    <div class="surat-avatar"></div>
    <button onclick="mulai()">BUKA PESAN DARI RUSDY 💌</button>
</div>

<div class="card" id="mainCard">

    <div class="avatar" id="catGif"></div>

    <div class="text-box">
        <div class="text typing" id="text"></div>
    </div>

    <div class="btn-wrapper" id="btnGroup">
        <button id="yes">Iya dimaapin😇</button>
        <button id="no">Emooh😏!</button>
    </div>

</div>

<script>

const tracks = [
"https://raw.githubusercontent.com/rusdyXBT/pripasi/main/play/ciio.mp3",
"https://raw.githubusercontent.com/rusdyXBT/pripasi/main/play/mas.mp3"
];

let currentTrack = 0;

const music = new Audio(tracks[currentTrack]);

music.onended = function(){

    currentTrack = (currentTrack + 1) % tracks.length;

    music.src = tracks[currentTrack];

    music.play();
};

const textEl = document.getElementById("text");
const btnGroup = document.getElementById("btnGroup");
const catGifEl = document.getElementById("catGif");
const noBtn = document.getElementById("no");
const mainCard = document.getElementById("mainCard");

const normalGifs = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/bubu-bubu-dudu.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/bubu-dance.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/bubu-dancing-dance.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/cat.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/happy-dance.gif"
];

const finalDanceGifs = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/haleys-ouo.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/stella-hsr-cute-dance-stella-hsr.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/tanzen-hase-hyper-hase-sehr-gut.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/vision-sloth.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/happy-dance.gif"
];

const backgroundList = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/desktop-wallpaper-pin-oleh-w-yaya-di-peach-et-goma-%E2%9D%A4-seni-kucing-ilustrasi-hewan-seni-thumbnail.jpg",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/images_19d187a4696.jpeg",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/images_19d187b55ee.jpeg"
];

const texts = [
"Minalaidzin walfaidin mon maap lahir batin betinaku ❤️",
"Maapkan diriku jika ada salah 🤗",
"Memang diriku kadang membuatmu kesal karena diriku pembuli hamdal 🤙",
" 🗿",
"Intinyah maapkan diriku jir lah kesayanganku... 👍",
"Bedosa jika tidak di maapkan 🤗 KATA KATA HARI INI UNTUK AYU KESAYANGANKU ❤️",
"JIKA LAHIRMU DITAKDIRKAN UNTUKU, MAKA BATINKU SIAP SELAMANYA MENJADI MILIKMU. 🥰",
];

const angryTexts = [
"PARAH ANY AYANG!!! 💢",
"KOG MASI PENCET ITU SIH SAYANG! 😤",
"AH MALAS MALAS! 😫",
"KLIK IYAH AJA KENAPA SIH SAYANG DENDAM BANGET JIL? 👊",
"APA SUSAHNYA KLIK MAAPKAN SAYANG DOSA WEI LEBARAN INI 🗿 ! 🥺",
"ISSSH AYANG 😡"
];

const angryGifs = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-rTRYbFx38K.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-YNbTiWGdcr.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-xKnUJBPzZf.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-QCaiGlMeJg.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/angry-angry-emoji.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/anime-aaaa.gif"
];

let step = 0;
let angryIdx = 0;
let isTyping = false;

/* bunga */
function createFlower(){

    const flower = document.createElement("div");

    flower.className = "flower";

    const flowers = ["🌸","🌺","💮","🌷","✨"];

    flower.innerHTML =
    flowers[Math.floor(Math.random()*flowers.length)];

    flower.style.left =
    Math.random() * 100 + "vw";

    flower.style.animationDuration =
    (Math.random()*4 + 5) + "s";

    flower.style.fontSize =
    (Math.random()*12 + 16) + "px";

    document.body.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },9000);
}

setInterval(createFlower,700);

function mulai(){

    document.getElementById("overlay").style.display = "none";

    mainCard.style.display = "block";

    music.play().catch(() => {});

    catGifEl.style.backgroundImage =
    `url('${normalGifs[0]}')`;

    typeWriter(texts[0], textEl, () => {

        btnGroup.style.opacity = "1";

    });
}

function typeWriter(text, element, callback){

    if(isTyping) return;

    isTyping = true;

    element.classList.add("typing");

    let i = 0;

    element.textContent = "";

    btnGroup.style.opacity = "0";

    function type(){

        if(i < text.length){

            element.textContent += text.charAt(i);

            i++;

            setTimeout(type, 200);

        }else{

            isTyping = false;

            /* cursor tetap nyala */

            if(callback) setTimeout(callback,300);
        }
    }

    type();
}

document.getElementById("yes").onclick = () => {

    if(isTyping) return;

    mainCard.classList.remove("vibrate-mode");

    noBtn.style.position = "relative";
    noBtn.style.left = "0";
    noBtn.style.top = "0";

    step++;

    if(step < texts.length){

        document.body.style.backgroundImage =
        `url('${backgroundList[step % backgroundList.length]}')`;

        document.querySelector(".text-box").style.backgroundImage =
        `url('${backgroundList[step % backgroundList.length]}')`;

        catGifEl.style.backgroundImage =
        `url('${normalGifs[step % normalGifs.length]}')`;

        typeWriter(texts[step], textEl, () => {

            btnGroup.style.opacity = "1";

        });

    }else{

        btnGroup.style.display = "none";

        textEl.textContent =
        "MAKASIH YA SUDAH DIMAAPKAN! 🥰🙏";

        let fIdx = 0;

        setInterval(() => {

            catGifEl.style.backgroundImage =
            `url('${finalDanceGifs[fIdx % finalDanceGifs.length]}')`;

            fIdx++;

        },4000);
    }
};

noBtn.onclick = () => {

    if(navigator.vibrate){

        navigator.vibrate([150,50,150]);
    }

    mainCard.classList.add("vibrate-mode");

    catGifEl.style.backgroundImage =
    `url('${angryGifs[angryIdx % angryGifs.length]}')`;

    textEl.textContent =
    angryTexts[angryIdx % angryTexts.length];

    angryIdx++;

    noBtn.style.position = "absolute";

    const maxX =
    mainCard.clientWidth - noBtn.clientWidth - 20;

    const maxY =
    mainCard.clientHeight - noBtn.clientHeight - 20;

    noBtn.style.left =
    Math.random() * maxX + "px";

    noBtn.style.top =
    Math.random() * maxY + "px";
};

</script>

</body>
</html>
