<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>aset negara 🔐</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:'Nunito',sans-serif;
}

body{
    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg') no-repeat center center fixed;
    background-size:cover;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
    position:relative;
    transition:1s ease;
}

/* blur tipis */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.14);
    backdrop-filter:blur(2px);
    z-index:1;
}

/* glow halus */
body::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:radial-gradient(circle,
    rgba(255,77,109,.10),
    transparent 70%);
    filter:blur(20px);
    z-index:1;
}

/* overlay */
#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.82);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#overlay .avatar{
    width:135px;
    height:135px;
    border-radius:28px;
    border:4px solid rgba(255,255,255,.8);
    margin-bottom:25px;
    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/love-letter-send-love.gif') center/cover;
    box-shadow:
    0 0 25px rgba(255,255,255,.25),
    0 0 40px rgba(255,77,109,.25);
    animation:floaty 3s ease-in-out infinite;
}

@keyframes floaty{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

#overlay button{
    border:none;
    color:white;
    cursor:pointer;
    font-size:17px;
    font-weight:900;
    padding:16px 30px;
    border-radius:50px;
    background:linear-gradient(135deg,#ff4d6d,#ff758f);
    box-shadow:0 10px 25px rgba(255,77,109,.35);
    transition:.2s;
}

#overlay button:active{
    transform:scale(.96);
}

/* CARD */
.card{
    position:relative;
    z-index:10;

    width:88%;
    max-width:315px;

    padding:72px 16px 22px;

    border-radius:30px;

    overflow:visible;

    text-align:center;

    border:1.5px solid rgba(255,255,255,0.20);

    display:none;

    background:url('https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg') center/cover;

    box-shadow:
    0 10px 30px rgba(0,0,0,.32);

    transform:translateY(-18px);
}

/* blur elegan */
.card::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.02)
    );

    backdrop-filter:blur(6px);

    border-radius:30px;

    z-index:-1;
}

/* glow tipis */
.card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:30px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.06),
        transparent 40%
    );

    pointer-events:none;
}

/* sparkle */
.spark{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:white;
    opacity:.7;
    animation:blink 2s linear infinite;
}

.spark:nth-child(1){
    top:14%;
    left:10%;
}

.spark:nth-child(2){
    top:18%;
    right:12%;
    animation-delay:1s;
}

.spark:nth-child(3){
    bottom:18%;
    left:14%;
    animation-delay:2s;
}

.spark:nth-child(4){
    bottom:12%;
    right:18%;
    animation-delay:1.5s;
}

@keyframes blink{
    0%,100%{
        opacity:.2;
        transform:scale(.6);
    }
    50%{
        opacity:.9;
        transform:scale(1.3);
    }
}

.vibrate-mode{
    animation:vibrate .15s linear infinite;
}

@keyframes vibrate{
    0%{
        transform:translateY(-18px);
    }
    25%{
        transform:translate(-3px,3px) translateY(-18px);
    }
    50%{
        transform:translate(3px,-3px) translateY(-18px);
    }
    100%{
        transform:translateY(-18px);
    }
}

/* GIF DI LUAR CARD */
.avatar{
    width:112px;
    height:112px;

    position:absolute;

    top:-55px;
    left:50%;

    transform:translateX(-50%);

    border-radius:26px;

    border:3px solid rgba(255,255,255,.88);

    background:center/cover no-repeat;

    box-shadow:
    0 0 18px rgba(255,255,255,.18),
    0 0 28px rgba(255,77,109,.16),
    0 8px 18px rgba(0,0,0,.28);

    transition:.5s ease;
}

.text{
    font-size:18px;
    line-height:1.55;

    min-height:95px;

    margin-bottom:22px;

    font-weight:900;

    letter-spacing:.3px;

    text-shadow:
    0 2px 8px rgba(0,0,0,.55);
}

.btn-wrapper{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;

    opacity:0;

    transition:.4s;
}

button{
    border:none;

    cursor:pointer;

    padding:13px 5px;

    font-size:15px;

    font-weight:900;

    border-radius:16px;

    transition:.2s;
}

button:active{
    transform:scale(.95);
}

#yes{
    background:linear-gradient(135deg,#ffffff,#ffe7ee);
    color:#ff4d6d;

    box-shadow:
    0 6px 20px rgba(255,255,255,.2);
}

#no{
    background:linear-gradient(135deg,#ff3c5f,#ff6b81);
    color:white;

    position:relative;

    box-shadow:
    0 6px 20px rgba(255,77,109,.3);
}

/* hati */
.heart{
    position:fixed;
    bottom:-50px;

    font-size:22px;

    color:rgba(255,77,109,.7);

    pointer-events:none;

    z-index:2;

    animation:flyUp 4s linear forwards;
}

@keyframes flyUp{
    0%{
        transform:translateY(0) scale(1);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh) scale(1.8) rotate(45deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<div id="overlay">
    <div class="avatar"></div>
    <button onclick="mulai()">BUKA PESAN DARI RUSDY 💌</button>
</div>

<div class="card" id="mainCard">

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <div class="avatar" id="catGif"></div>

    <div class="text" id="text"></div>

    <div class="btn-wrapper" id="btnGroup">
        <button id="yes">Iya dimaapin😇</button>
        <button id="no">Emooh😏!</button>
    </div>

</div>

<script>

const tracks = [
"https://raw.githubusercontent.com/rusdyXBT/pripasi/main/play/ciio.mp3",
"https://raw.githubusercontent.com/rusdyXBT/pripasi/main/play/mas.mp3"
];

let currentTrack = 0;

const music = new Audio(tracks[currentTrack]);

music.onended = function(){

    currentTrack = (currentTrack + 1) % tracks.length;

    music.src = tracks[currentTrack];

    music.play();
};

const textEl = document.getElementById("text");
const btnGroup = document.getElementById("btnGroup");
const catGifEl = document.getElementById("catGif");
const noBtn = document.getElementById("no");
const mainCard = document.getElementById("mainCard");

const normalGifs = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/bubu-bubu-dudu.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/bubu-dance.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/bubu-dancing-dance.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/cat.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/happy-dance.gif"
];

const finalDanceGifs = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/haleys-ouo.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/stella-hsr-cute-dance-stella-hsr.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/tanzen-hase-hyper-hase-sehr-gut.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/vision-sloth.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/senang/happy-dance.gif"
];

const backgroundList = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/2a82ced80deb5273d117f7fe168045b7.jpg",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/desktop-wallpaper-pin-oleh-w-yaya-di-peach-et-goma-%E2%9D%A4-seni-kucing-ilustrasi-hewan-seni-thumbnail.jpg",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/images_19d187a4696.jpeg",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/images_19d187b55ee.jpeg"
];

const texts = [
"MINAL AIDIN WALPAIDIN MON MAAP LAHIR BATIN 🙏",
"MAAPKAN RUSDY KALAW ADA SALAH 🤗",
"MEMANG RUSDY SUKA MEMAKI DAN MEMBULI 🤡",
"TETAPI NTU SEMUWA MEMANG HOBY 🗿",
"INTINYAH MAAPKAN RUSDY JIR LAH SLEBEW... 🤤",
"BEDOSA JIKA TIDAK DI MAAPKAN 🤗",
"MOHON MAAP SEKALI LAGI, JIKA LAHIRMU DITAKDIRKAN UNTUKU, MAKA BATINKU SIAP SELAMANYA MENJADI MILIKMU. Aww...Aww...slebew. 🤤",
];

const angryTexts = [
"PARAH ANY!!! 💢",
"KOG MASI PENCET ITU ANY! 😤",
"AH MALAS MENANGGAPI! 😫",
"KLIK IYAH AJA KENAPA SIH ANY? 👊",
"APA SUSAHNYA KLIK MAAPKAN ANY ! 🥺",
"DOSA WEI LEBARAN INI😡"
];

const angryGifs = [
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-rTRYbFx38K.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-YNbTiWGdcr.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-xKnUJBPzZf.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/mala/fetchpik.com-QCaiGlMeJg.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/angry-angry-emoji.gif",
"https://raw.githubusercontent.com/rusdyXBT/Gifx/main/Niw/anime-aaaa.gif"
];

let step = 0;
let angryIdx = 0;
let isTyping = false;

function mulai(){

    document.getElementById("overlay").style.display = "none";

    mainCard.style.display = "block";

    music.play().catch(() => {});

    catGifEl.style.backgroundImage = `url('${normalGifs[0]}')`;

    typeWriter(texts[0], textEl, () => {

        btnGroup.style.opacity = "1";

    });
}

function typeWriter(text, element, callback){

    if(isTyping) return;

    isTyping = true;

    let i = 0;

    element.textContent = "";

    btnGroup.style.opacity = "0";

    function type(){

        if(i < text.length){

            element.textContent += text.charAt(i);

            i++;

            setTimeout(type, 70);

        }else{

            isTyping = false;

            if(callback) setTimeout(callback, 300);
        }
    }

    type();
}

function createHeart(){

    const h = document.createElement("div");

    h.innerHTML = "❤️";

    h.className = "heart";

    h.style.left = Math.random() * 100 + "vw";

    h.style.animationDuration =
    Math.random() * 2 + 3 + "s";

    document.body.appendChild(h);

    setTimeout(() => h.remove(), 4500);
}

document.getElementById("yes").onclick = () => {

    if(isTyping) return;

    mainCard.classList.remove("vibrate-mode");

    noBtn.style.position = "relative";
    noBtn.style.left = "0";
    noBtn.style.top = "0";

    step++;

    for(let i=0;i<10;i++){

        setTimeout(createHeart, i * 150);
    }

    if(step < texts.length){

        document.body.style.backgroundImage =
        `url('${backgroundList[step % backgroundList.length]}')`;

        mainCard.style.backgroundImage =
        `url('${backgroundList[step % backgroundList.length]}')`;

        catGifEl.style.backgroundImage =
        `url('${normalGifs[step % normalGifs.length]}')`;

        typeWriter(texts[step], textEl, () => {

            btnGroup.style.opacity = "1";

        });

    }else{

        btnGroup.style.display = "none";

        textEl.textContent =
        "MAKASIH YA SUDAH DIMAAPKAN! 🥰🙏";

        setInterval(createHeart, 250);

        let fIdx = 0;

        setInterval(() => {

            catGifEl.style.backgroundImage =
            `url('${finalDanceGifs[fIdx % finalDanceGifs.length]}')`;

            fIdx++;

        }, 4000);
    }
};

noBtn.onclick = () => {

    if(navigator.vibrate){

        navigator.vibrate([150,50,150]);
    }

    mainCard.classList.add("vibrate-mode");

    catGifEl.style.backgroundImage =
    `url('${angryGifs[angryIdx % angryGifs.length]}')`;

    textEl.textContent =
    angryTexts[angryIdx % angryTexts.length];

    angryIdx++;

    noBtn.style.position = "absolute";

    const maxX =
    mainCard.clientWidth - noBtn.clientWidth - 20;

    const maxY =
    mainCard.clientHeight - noBtn.clientHeight - 20;

    noBtn.style.left =
    Math.random() * maxX + "px";

    noBtn.style.top =
    Math.random() * maxY + "px";
};

</script>

</body>
</html>
